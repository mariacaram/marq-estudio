<!DOCTYPE html>
<html lang="es">
<head>
<!--
THESIS: Vidriera-galería de Marq.: la obra fotografiada protagoniza sobre blanco cálido y
todo camino termina en un contacto por WhatsApp; rechaza el home oscuro con overlays del sitio anterior.
OWN-WORLD: Blanco cálido #FAF9F7, tinta #1C1B19, taupe del logo #7A756E, hairlines; Canaro (7 pesos)
como única voz; el degradé iridiscente del logo como único acento (punto de la marca, hairlines, barras).
Galerías justificadas tipo Google Fotos; franja carbón .M en cada obra.
STORY: El visitante entra por una foto a pantalla completa con la .M, entiende qué hace el estudio,
recorre obras, conoce a Rosario y Emilia, compara dos servicios con entregables y precios "desde",
y escribe por WhatsApp en un toque.
FIRST VIEWPORT: foto fullscreen con Ken Burns lento, .M centrada sobre el eslogan, nav transparente,
indicador de scroll, botón WhatsApp flotante.
FORM: dirección pineada por el cliente — estética renstudio.ar traducida a Canaro y a la marca Marq.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marq. Estudio — Arquitectura &amp; Diseño de Interiores</title>
<meta name="description" content="Marq. Estudio: arquitectura y diseño de interiores en Yerba Buena, Tucumán. Espacios que inspiran y emocionan.">
<link rel="canonical" href="https://marq-estudio.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Marq. Estudio">
<meta property="og:title" content="Marq. Estudio — Arquitectura &amp; Diseño de Interiores">
<meta property="og:description" content="Espacios que inspiran y emocionan. Arquitectura y diseño de interiores en Yerba Buena, Tucumán.">
<meta property="og:url" content="https://marq-estudio.vercel.app/">
<meta property="og:image" content="https://marq-estudio.vercel.app/assets/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_AR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/brand/favicon.svg?v=3" type="image/svg+xml">
<link rel="preload" href="assets/fonts/canaro/Canaro-ExtraLight.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/canaro/Canaro-Book.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css?v=11">
</head>
<body>

<main id="app" style="min-height:100svh"></main>

<script src="js/site.js?v=6"></script>
<script src="js/gallery.js?v=3"></script>
<script>
(async function () {
  const { loadData, renderChrome, preloader, initReveals, animateScrollTo, gotoHashOnLoad, waLink, escapeHtml, nl2br } = window.MARQ;
  preloader();

  let data;
  try { data = await loadData(); }
  catch (e) {
    document.getElementById("app").innerHTML =
      '<p style="padding:8rem 2rem;text-align:center;color:#7A756E">No pudimos cargar el contenido. Recargá la página en unos segundos.</p>';
    console.error(e); return;
  }

  const aj = data.ajustes;
  const app = document.getElementById("app");

  const twoTone = t => String(t || "").split("\n").map((l, i) =>
    `<span${i % 2 ? ' class="tone"' : ""}>${escapeHtml(l)}</span>`).join("<br>");

  /* ---------- Secciones ---------- */
  const heroLines = String(data.inicio.eslogan || "").split("\n").map((l, i) =>
    `<span class="hl"><span style="--d:${(0.85 + i * 0.28).toFixed(2)}s">${escapeHtml(l)}</span></span>`).join("");
  const heroHtml = `
    <section class="hero" id="inicio">
      <div class="hero-media"><img src="${escapeHtml(data.inicio.imagen)}" alt="" fetchpriority="high"></div>
      <div class="hero-inner">
        <img class="hero-mark" src="assets/brand/m-celeste.svg" alt="Marq.">
        <span class="hero-line" aria-hidden="true"></span>
        <h1 class="display">${heroLines}</h1>
        <p class="hero-sub">${escapeHtml(data.inicio.sub)}</p>
      </div>
      <button class="hero-scroll" data-goto="#proyectos"><span>Descubrir</span><span class="line"></span></button>
    </section>`;

  const projHtml = `
    <section class="section" id="proyectos">
      <div class="wrap">
        <div class="section-head">
          <p class="kicker reveal">Portfolio</p>
          <h2 class="h-section reveal">${twoTone(data.proyectos.titulo)}</h2>
        </div>
        <div class="proj-grid">
          ${data.proyectos.items.map(p => `
            <a class="proj-card reveal" href="proyecto.html?p=${encodeURIComponent(p.slug)}">
              <div class="frame"><img src="Proyectos/${escapeHtml(p.slug)}/${escapeHtml(p.portada)}" alt="${escapeHtml(p.titulo)}" loading="lazy"></div>
              <div class="meta"><h3>${escapeHtml(p.titulo)}</h3><span class="cat">${escapeHtml(p.categoria)} · ${escapeHtml(p.anio)}</span></div>
            </a>`).join("")}
        </div>
      </div>
    </section>`;

  const team = data.estudio.integrantes || [];
  const aboutHtml = `
    <section class="section" id="estudio">
      <div class="wrap">
        <div class="about-head">
          <div>
            <p class="kicker reveal">Quiénes somos</p>
            <h2 class="h-section reveal" style="margin-bottom:0">${twoTone(data.estudio.titulo)}</h2>
          </div>
          <div class="about-copy">
            ${data.estudio.parrafos.map(p => `<p class="lead reveal">${escapeHtml(p)}</p>`).join("")}
          </div>
        </div>
      </div>
      <figure class="about-banner reveal-img">
        <img src="${escapeHtml(data.estudio.imagen)}" alt="Rosario y Emilia, fundadoras de Marq. Estudio" loading="lazy">
        <blockquote class="reveal">“${escapeHtml(data.estudio.cita)}”</blockquote>
      </figure>
      <div class="wrap">
        <div class="team" data-stagger>
          ${team.map(m => `
            <article>
              <div class="frame">${m.foto
                ? `<img src="${escapeHtml(m.foto)}" alt="${escapeHtml(m.nombre)}" loading="lazy">`
                : `<span class="ph mark"><span class="dot">.</span>M</span>`}</div>
              <h3>${escapeHtml(m.nombre)}</h3>
              <span class="rol">${escapeHtml(m.rol)}</span>
              <p class="bio">${escapeHtml(m.bio)}</p>
            </article>`).join("")}
        </div>
      </div>
    </section>`;

  const servHtml = `
    <section class="section" id="servicios">
      <div class="wrap">
        <div class="section-head">
          <p class="kicker reveal">Diseños a distancia</p>
          <h2 class="h-section reveal">${twoTone(data.servicios.titulo)}</h2>
          <p class="lead reveal">${escapeHtml(data.servicios.intro)}</p>
        </div>
        <div class="svc-list reveal">
          ${data.servicios.items.map((s, i) => `
            <article class="svc-item" id="serv-${escapeHtml(s.id)}">
              <button class="svc-row" aria-expanded="false" aria-controls="svc-body-${i}">
                <span class="svc-num">${String(i + 1).padStart(2, "0")}</span>
                <span class="svc-name">${escapeHtml(s.nombre)}</span>
                <span class="svc-desde">USD ${Number(s.desdeUSD).toLocaleString("es-AR")}</span>
                <span class="svc-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 9l6 6 6-6"/></svg></span>
              </button>
              <div class="svc-body" id="svc-body-${i}">
                <div class="svc-body-inner">
                  <div class="svc-cols">
                    <div>
                      <p class="bajada">${escapeHtml(s.bajada)}</p>
                      <ul class="para">${(s.para || []).map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
                      <div class="cta-row"><button class="btn" data-goto="#contacto" data-servicio="${escapeHtml(s.nombre)}">Quiero este programa</button></div>
                    </div>
                    <div class="entregables">
                      <h4>Qué incluye</h4>
                      <ul>${(s.entregables || []).map(x => `<li>${escapeHtml(x)}</li>`).join("")}</ul>
                    </div>
                  </div>
                </div>
              </div>
            </article>`).join("")}
        </div>
      </div>
    </section>`;

  // Instagram: marquesina infinita con fotos de las obras (estilo REN)
  const igFotos = ["01","02","03","04","05","06","07","08","09","10","11","12"].map(n => `assets/instagram/ig-${n}.jpg`);
  const igTrack = igFotos.map(src =>
    `<a href="${escapeHtml(aj.instagram)}" target="_blank" rel="noopener" aria-label="Abrir Instagram" tabindex="-1"><img src="${escapeHtml(src)}" alt="" loading="lazy"></a>`).join("");
  const followHtml = `
    <section class="section follow">
      <div class="wrap">
        <p class="kicker reveal" style="justify-content:center">Seguinos</p>
        <h2 class="h-section reveal">En Instagram.</h2>
        <a class="handle reveal" href="${escapeHtml(aj.instagram)}" target="_blank" rel="noopener">@_marq.estudio</a>
      </div>
      <div class="follow-marquee reveal" aria-hidden="false">
        <div class="marquee-track">${igTrack}${igTrack}</div>
      </div>
    </section>`;

  const contactoHtml = `
    <section class="section dark" id="contacto">
      <div class="wrap">
        <div class="contact-grid">
          <div>
            <p class="kicker reveal">Contacto</p>
            <h2 class="h-section reveal">${twoTone(data.contacto.titulo)}</h2>
            <p class="lead reveal">${escapeHtml(data.contacto.intro)}</p>
            <div class="contact-info reveal">
              ${aj.whatsapps.map(w => `
                <a class="big-link" href="${waLink(w.numero)}" target="_blank" rel="noopener">
                  <span>${escapeHtml(w.nombre)}</span><span class="tag">WhatsApp →</span>
                </a>`).join("")}
              <a class="big-link" href="mailto:${escapeHtml(aj.email)}"><span>${escapeHtml(aj.email)}</span><span class="tag">Email →</span></a>
              <a class="big-link" href="${escapeHtml(aj.instagram)}" target="_blank" rel="noopener"><span>@_marq.estudio</span><span class="tag">Instagram →</span></a>
            </div>
          </div>
          <form class="contact-form reveal" id="contact-form">
            <div class="form-block">
              <h4>Mi proyecto necesita…</h4>
              <div class="chips" id="chips-necesidad">
                ${data.contacto.necesidades.map(n => `<button type="button" class="chip" data-v="${escapeHtml(n)}">${escapeHtml(n)}</button>`).join("")}
              </div>
            </div>
            <div class="form-block">
              <h4>Presupuesto estimado (USD)</h4>
              <div class="chips" id="chips-presupuesto">
                ${aj.rangosPresupuesto.map(r => `<button type="button" class="chip" data-v="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join("")}
              </div>
              <p class="form-note">Nuestros proyectos integrales parten de USD ${Number(aj.precioMinimoUSD).toLocaleString("es-AR")}.</p>
            </div>
            <div class="form-block">
              <h4>Contanos un poco más</h4>
              <div class="field"><input type="text" id="f-nombre" placeholder="Tu nombre" autocomplete="name"></div>
              <div class="field"><textarea id="f-msg" rows="3" placeholder="Qué espacio querés transformar, en qué ciudad está…"></textarea></div>
            </div>
            <div class="form-block">
              <h4>¿Con quién querés hablar?</h4>
              <div class="chips" id="chips-wa">
                ${aj.whatsapps.map((w, i) => `<button type="button" class="chip${i === 0 ? " sel" : ""}" data-wa="${escapeHtml(w.numero)}">${escapeHtml(w.nombre)}</button>`).join("")}
              </div>
            </div>
            <div class="send-row">
              <button type="button" class="btn btn-send" id="send-wa">Enviar por WhatsApp&nbsp;↗</button>
            </div>
          </form>
        </div>
      </div>
    </section>`;

  app.innerHTML = heroHtml + projHtml + aboutHtml + servHtml + followHtml + contactoHtml;
  renderChrome(data, { onHero: true, base: "" });
  initReveals();
  gotoHashOnLoad();

  /* ---------- Interacción ---------- */
  // scroll suave a anclas + preselección de servicio
  document.addEventListener("click", e => {
    const go = e.target.closest("[data-goto]");
    if (!go) return;
    const target = document.querySelector(go.dataset.goto);
    if (target) animateScrollTo(target.getBoundingClientRect().top + window.scrollY);
    if (go.dataset.servicio) {
      document.querySelectorAll("#chips-necesidad .chip").forEach(c => {
        if (c.dataset.v === go.dataset.servicio) { c.classList.add("sel"); }
      });
    }
  });

  // acordeón de servicios (uno abierto a la vez)
  document.querySelectorAll(".svc-row").forEach(row => {
    row.addEventListener("click", () => {
      const item = row.closest(".svc-item");
      const open = item.classList.contains("open");
      document.querySelectorAll(".svc-item.open").forEach(x => {
        x.classList.remove("open");
        x.querySelector(".svc-row").setAttribute("aria-expanded", "false");
      });
      if (!open) {
        item.classList.add("open");
        row.setAttribute("aria-expanded", "true");
      }
    });
  });

  // chips selección única por grupo (necesidad admite varias; persona siempre queda una elegida)
  ["chips-necesidad", "chips-presupuesto", "chips-wa"].forEach(id => {
    const g = document.getElementById(id);
    g.addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      const multi = id === "chips-necesidad";
      if (!multi) g.querySelectorAll(".chip").forEach(c => { if (c !== chip) c.classList.remove("sel"); });
      if (id === "chips-wa") chip.classList.add("sel");
      else chip.classList.toggle("sel");
    });
  });

  // enviar por WhatsApp
  document.getElementById("send-wa").addEventListener("click", () => {
    const persona = document.querySelector("#chips-wa .chip.sel") || document.querySelector("#chips-wa .chip");
    const nec = [...document.querySelectorAll("#chips-necesidad .chip.sel")].map(c => c.dataset.v);
    const pres = document.querySelector("#chips-presupuesto .chip.sel");
    const nombre = document.getElementById("f-nombre").value.trim();
    const msg = document.getElementById("f-msg").value.trim();
    let texto = "Hola Marq.! " + (nombre ? "Soy " + nombre + ". " : "") + "Vengo de la página web.";
    if (nec.length) texto += "\nMi proyecto necesita: " + nec.join(", ") + ".";
    if (pres) texto += "\nPresupuesto estimado: USD " + pres.dataset.v + ".";
    if (msg) texto += "\n" + msg;
    window.open(waLink(persona.dataset.wa, texto), "_blank", "noopener");
  });

  // parallax sutil del hero
  const heroImg = document.querySelector(".hero-media img");
  if (heroImg && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    addEventListener("scroll", () => {
      const y = Math.min(window.scrollY, window.innerHeight);
      heroImg.style.translate = "0 " + y * 0.18 + "px";
    }, { passive: true });
  }
})();
</script>
</body>
</html>
